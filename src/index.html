function aggregateGames() {
  const m = new Map();
  for (const a of S.vault.accounts) {
    const seen = new Set();
    for (const g of a.games) {
      const k = norm(g.game);
      if (!k) continue;
      let e = m.get(k);
      if (!e) { e = { key: k, name: g.game, count: 0, hours: 0 }; m.set(k, e); }
      if (g.hours) e.hours += g.hours;
      if (!seen.has(k)) { seen.add(k); e.count++; }
    }
  }
  return Array.from(m.values()).sort((x, y) => y.count - x.count || collator.compare(x.name, y.name));
}
function aggregatePlatforms() {
  const m = new Map();
  for (const a of S.vault.accounts) {
    const k = platformKey(a);
    let e = m.get(k);
    if (!e) { e = { key: k, name: platformName(a), color: platformOf(a).color, count: 0 }; m.set(k, e); }
    e.count++;
  }
  return Array.from(m.values()).sort((x, y) => y.count - x.count || collator.compare(x.name, y.name));
}
function aggregateStatuses() {
  const counts = {};
  for (const a of S.vault.accounts) counts[a.status] = (counts[a.status] || 0) + 1;
  return STATUSES.filter(s => counts[s.id]).map(s => ({ key: s.id, name: s.label, count: counts[s.id] }));
}
function aggregateTags() {
  const m = new Map();
  for (const a of S.vault.accounts) for (const t of a.tags) {
    const k = norm(t);
    let e = m.get(k);
    if (!e) { e = { key: k, name: t, count: 0 }; m.set(k, e); }
    e.count++;
  }
  return Array.from(m.values()).sort((x, y) => y.count - x.count || collator.compare(x.name, y.name));
}
function matchesFilter(a) {
  const f = ui.filter;
  switch (f.type) {
    case 'fav': return a.favorite;
    case 'game': return a.games.some(g => norm(g.game) === f.value);
    case 'platform': return platformKey(a) === f.value;
    case 'status': return a.status === f.value;
    case 'tag': return a.tags.some(t => norm(t) === f.value);
    default: return true;
  }
}
function searchText(a) {
  const parts = [a.label, a.login, a.email, a.accountId, platformName(a), statusLabel(a.status), a.region, a.phone, a.recoveryEmail, a.tags.join(' '), a.notes, a.avatar && a.avatar.name];
  for (const g of a.games) parts.push(g.game, g.nickname, g.rank, g.peak, g.level, g.notes);
  for (const f of a.customFields) { parts.push(f.name); if (!f.secret) parts.push(f.value); }
  return norm(parts.filter(Boolean).join(' \u0001 '));
}
function visibleAccounts() {
  const terms = norm(ui.search).split(' ').filter(Boolean);
  const list = S.vault.accounts.filter(a => matchesFilter(a) && (!terms.length || (t => terms.every(x => t.includes(x)))(searchText(a))));
  return SORTS[prefs.sort].cmp ? list.sort(SORTS[prefs.sort].cmp) : list;
}
// Move uma conta para antes/depois de outra. Se a ordenação atual não é "Minha ordem", ela vira a ordem
// manual primeiro (assim o arraste começa exatamente do que está na tela).
function moveAccount(id, targetId, after) {
  if (!S.unlocked || !id || id === targetId) return;
  const sortCmp = SORTS[prefs.sort].cmp;
  if (sortCmp) savePrefs({ sort: 'manual' });
  ui.animate = 'flip';
  commit(v => {
    if (sortCmp) v.accounts.sort(sortCmp);
    const from = v.accounts.findIndex(a => a.id === id);
    if (from < 0) return;
    const [item] = v.accounts.splice(from, 1);
    let to = v.accounts.findIndex(a => a.id === targetId);
    if (to < 0) { v.accounts.splice(from, 0, item); return; }
    v.accounts.splice(after ? to + 1 : to, 0, item);
  });
}
function wireReorder(main) {
  let dragId = null;
  const clear = () => { for (const el of $$('.card.drop-before, .card.drop-after, .card.dragging', main)) el.classList.remove('drop-before', 'drop-after', 'dragging'); };
  const sideOf = (card, e) => {
    const r = card.getBoundingClientRect();
    return card.classList.contains('tile') ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
  };
  main.addEventListener('dragstart', e => {
    const card = e.target.closest && e.target.closest('.card[data-key]');
    if (!card || !main.contains(card) || ui.view !== 'accounts') return;
    dragId = card.dataset.key;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', ''); } catch (err) { /* ignora */ }
    requestAnimationFrame(() => card.classList.add('dragging'));
  });
  main.addEventListener('dragover', e => {
    if (!dragId) return;
    const card = e.target.closest && e.target.closest('.card[data-key]');
    if (!card || card.dataset.key === dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = sideOf(card, e);
    for (const el of $$('.card.drop-before, .card.drop-after', main)) if (el !== card) el.classList.remove('drop-before', 'drop-after');
    card.classList.toggle('drop-after', after);
    card.classList.toggle('drop-before', !after);
  });
  main.addEventListener('drop', e => {
    if (!dragId) return;
    const card = e.target.closest && e.target.closest('.card[data-key]');
    e.preventDefault();
    const id = dragId;
    dragId = null;
    clear();
    if (card && card.dataset.key !== id) moveAccount(id, card.dataset.key, sideOf(card, e));
  });
  main.addEventListener('dragend', () => { dragId = null; clear(); });
}
function filterTitle() {
  const f = ui.filter;
  switch (f.type) {
    case 'fav': return 'Favoritas';
    case 'game': { const g = aggregateGames().find(x => x.key === f.value); return g ? g.name : 'Jogo'; }
    case 'platform': { const p = aggregatePlatforms().find(x => x.key === f.value); return p ? p.name : 'Plataforma'; }
    case 'status': return statusLabel(f.value);
    case 'tag': { const t = aggregateTags().find(x => x.key === f.value); return '#' + (t ? t.name : f.value); }
    default: return 'Todas as contas';

function getAudit() {
  if (auditCache) return auditCache;
  const all = S.vault.accounts;
  const accs = all.filter(a => a.status !== 'vendida');
  const byPw = new Map();
  for (const a of accs) if (a.password) { if (!byPw.has(a.password)) byPw.set(a.password, []); byPw.get(a.password).push(a); }
  const reuseOk = a => !!a.reuseOk && a.reuseOk === (a.passwordUpdatedAt || a.createdAt);
  const groups = Array.from(byPw.values()).filter(g => g.length > 1);
  const reusedGroups = groups.filter(g => !g.every(reuseOk)); // grupo inteiro ignorado → sem aviso, sem ícone, sem desconto
  const ignoredReuse = groups.length - reusedGroups.length;
  const reusedIds = new Set(reusedGroups.flat().map(a => a.id));
  const weak = [], no2fa = [], old = [], nopass = [];
  const byId = new Map();
  const yearAgo = Date.now() - 365 * 864e5;
  for (const a of accs) {
    const issues = [];
    if (!a.password) nopass.push(a);
    else {
      if (reusedIds.has(a.id)) issues.push('reused');
      const st = strength(a.password, pwCtx(a));
      if (st.score <= 1) { weak.push({ a, st }); issues.push('weak'); }
      const ref = Date.parse(a.passwordUpdatedAt || a.createdAt);
      if (!isNaN(ref) && ref < yearAgo) { old.push(a); issues.push('old'); }
    }
    if (!a.twoFA || a.twoFA === 'nenhum') { no2fa.push(a); issues.push('no2fa'); }
    byId.set(a.id, issues);
  }
  const pts = accs.map(a => {
    const is = byId.get(a.id);
    let p = 100;
    if (is.includes('reused')) p -= 40;
    if (is.includes('weak')) p -= 30;
    if (is.includes('no2fa')) p -= 20;
    if (is.includes('old')) p -= 10;
    return Math.max(0, p);
  });
  const alertIds = new Set(accs.filter(a => { const is = byId.get(a.id); return is.includes('reused') || is.includes('weak'); }).map(a => a.id));
  auditCache = {
    reusedGroups, ignoredReuse, weak, no2fa, old, nopass, byId,
    considered: accs.length, skipped: all.length - accs.length,
    score: pts.length ? Math.round(pts.reduce((x, y) => x + y, 0) / pts.length) : 100,
    alertCount: alertIds.size
  };
  return auditCache;
}
function backupNeed() {
  const v = S.vault;
  if (!v || !v.accounts.length) return null;
  if (DESKTOP ? Desk.extraOk() : Autosave.status === 'ok') return null;
  const last = v.settings.lastBackupAt;
  if (!last) return 'Você ainda não fez nenhum backup.';
  const days = (Date.now() - Date.parse(last)) / 864e5;
  if (v.dataChangedAt > last && days >= 7) return 'Seu último backup foi ' + relTime(last) + ' e houve mudanças depois dele.';
  return null;
}

/// Animação de entrada só quando a vista/filtro/layout muda (ui.animate === 'full').
// Busca, ordenação e commits mantêm o conteúdo estável: os cartões que continuam na tela deslizam
// da posição antiga para a nova (FLIP via WAAPI) e só os que acabaram de aparecer fazem um fade curto.
let enterTimer = null, settleTimer = null;
const EASE = 'cubic-bezier(.16,1,.3,1)';
function measureCards(main) {
  const m = new Map();

}
function flipCards(main, before) {
  if (!before || !before.size || reducedMotion() || typeof Element.prototype.animate !== 'function') return;

    const r1 = c.getBoundingClientRect();
    const r0 = before.get(c.dataset.key);
    if (r0) {
      const dx = r0.left - r1.left, dy = r0.top - r1.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
      if ((r0.bottom < 0 || r0.top > vh) && (r1.bottom < 0 || r1.top > vh)) continue;
      c.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 240, easing: EASE });
    } else if (r1.bottom > 0 && r1.top < vh) {

    }

function valNetFor(el) {

function valAsk(el) {

function valMount() {

  out.region = val('region');

  for (const pair of [['spent', 'Valor investido'], ['inventoryValue', 'Valor do inventário']]) {
    const rawV = val(pair[0]);
    const n = rawV ? parseNum(rawV) : null;
    if (rawV && (n == null || n < 0)) return { error: pair[1] + ': digite um número válido (ex.: 150,90).', focus: el(pair[0]) };
    out[pair[0]] = n;
  }

  const baseGames = new Map((base.games || []).map(g => [g.id, g]));
  const games = [];
  for (const row of $$('.game-row', form)) {
    const q = c => row.querySelector(c).value.trim();
    const hRaw = q('.g-hours');
    const g = { id: row.dataset.gid || uid(), game: canonicalGame(q('.g-game')), nickname: q('.g-nick'), rank: q('.g-rank'), peak: q('.g-peak'), level: q('.g-level'), hours: null, notes: q('.g-notes') };
    if (hRaw) {

    }
    const hasData = g.nickname || g.rank || g.peak || g.level || hRaw || g.notes;
    if (!g.game) {
      if (hasData) return { error: 'Informe o nome do jogo (ou remova a linha).', focus: row.querySelector('.g-game') };
      continue;
    }
    const prev = baseGames.get(g.id);
    const changed = !prev || ['game', 'nickname', 'rank', 'peak', 'level', 'hours', 'notes'].some(k => (prev[k] == null ? '' : prev[k]) !== (g[k] == null ? '' : g[k]));

  const cfs = [];
  for (const row of $$('.cf-row', form)) {
    const name = row.querySelector('.cf-name').value.trim();
    const value = row.querySelector('.cf-value').value;
    if (!name && !value.trim()) continue;
    cfs.push({ id: row.dataset.cfid || uid(), name: name || 'Campo', value, secret: row.querySelector('.cf-sec').checked });
  }
  out.customFields = cfs;
  out.avatar = formAvatars.has(form) ? formAvatars.get(form) : (base.avatar || null);
  if (!out.label && !out.login && !out.email && !out.accountId && !games.length) {
    return { error: 'Preencha pelo menos o nome da conta, o login, o e-mail ou um jogo.', focus: el('label') };

  if (isNew) out.createdAt = t;

}
// Rascunho "do jeito que está" quando o formulário ainda não passa na validação (números inválidos e jogos sem nome ficam de fora)
function rawAccountForm(form, base) {
  const val = n => { const e = form.elements.namedItem(n); return e ? e.value : ''; };
  const out = JSON.parse(JSON.stringify(base));
  for (const k of ['platform', 'platformName', 'label', 'status', 'login', 'email', 'password', 'accountId', 'profileUrl', 'twoFA', 'phone', 'recoveryEmail', 'backupCodes', 'region', 'createdOn', 'spent', 'inventoryValue', 'notes']) out[k] = val(k);
  if (out.password !== (base.password || '')) out.passwordUpdatedAt = out.password ? nowISO() : '';
  out.favorite = !!(form.elements.namedItem('favorite') || {}).checked;
  out.tags = parseTags(val('tags'));
  out.games = $$('.game-row', form).map(row => {
    const q = c => row.querySelector(c).value;
    return { id: row.dataset.gid, game: canonicalGame(q('.g-game')), nickname: q('.g-nick'), rank: q('.g-rank'), peak: q('.g-peak'), level: q('.g-level'), hours: q('.g-hours'), notes: q('.g-notes') };
  });
  out.customFields = $$('.cf-row', form).map(row => ({ id: row.dataset.cfid, name: row.querySelector('.cf-name').value, value: row.querySelector('.cf-value').value, secret: row.querySelector('.cf-sec').checked }));
  if (formAvatars.has(form)) out.avatar = formAvatars.get(form);

}
function openAccountForm(id, opts) {
  if (!S.unlocked) return;
  opts = opts || {};
  const existing = id ? findAccount(id) : null;
  if (id && !existing) return;
  const isNew = !existing;
  // Rascunho restaurado (opts.draft): o formulário mostra o rascunho, mas compara e salva sobre a conta atual (orig)
  const orig = JSON.parse(JSON.stringify(existing || opts.template || blankAccount()));
  const base = opts.draft ? normalizeAccount(JSON.parse(JSON.stringify(opts.draft))) : orig;
  const gen0 = S.gen; // sessão em que o formulário abriu
  if (isNew && !base.games.length) base.games.push(blankGame());
  refreshGameDatalist();
  let saved = false;
  const d = openDialog({
    className: 'dlg-lg sheet', dismissable: false,
    content: accountFormHTML(base, isNew),
    onClose: () => { if (opts.fromDetail && S.unlocked && S.gen === gen0 && findAccount(id)) openDetail(id); if (saved && opts.onSaved) opts.onSaved(); }
  });
  const form = d.el.querySelector('form');
  const el = n => form.elements.namedItem(n);
  // Valores sensíveis entram via JS (fora dos atributos HTML)
  el('password').value = base.password || '';
  el('backupCodes').value = base.backupCodes || '';
  el('notes').value = base.notes || '';
  for (const row of $$('.cf-row', form)) {
    const f = base.customFields.find(x => x.id === row.dataset.cfid);
    if (f) row.querySelector('.cf-value').value = f.value;
  }
  wireAvatarField(form, base);
  let platformTouched = !isNew || !!opts.platformFixed || !!opts.draft;
  const strengthEl = form.querySelector('[data-strength]');
  const ctx = () => [el('login').value, el('email').value.split('@')[0], el('label').value, el('accountId').value];
  const paint = () => paintStrength(strengthEl, el('password').value, ctx());
  paint();
  el('password').addEventListener('input', paint);
  el('platform').addEventListener('change', () => {
    platformTouched = true;
    form.querySelector('.pname').hidden = el('platform').value !== 'outro';
  });
  const lenInput = form.querySelector('[data-gen="len"]'), lenOut = form.querySelector('[data-gen="out"]');
  lenInput.addEventListener('input', () => { lenOut.textContent = lenInput.value; });
  form.addEventListener('input', e => {
    const t = e.target;
    if (t.classList.contains('g-game')) {
      const row = t.closest('.game-row');
      const list = rankListFor(t.value);
      for (const r of row.querySelectorAll('.g-rank, .g-peak')) { if (list) r.setAttribute('list', list); else r.removeAttribute('list'); }
      if (!platformTouched) {
        const firstRow = form.querySelector('.game-row');
        const p = presetFor(t.value);
        if (p && row === firstRow && p.platform !== 'outro') {
          el('platform').value = p.platform;
          form.querySelector('.pname').hidden = true;
        }
      }
    }
  });
  form.addEventListener('change', e => {
    const t = e.target;
    if (t.classList.contains('cf-sec')) {
      const row = t.closest('.cf-row');
      const inp = row.querySelector('.cf-value');
      const btn = row.querySelector('[data-act="toggle-mask"]');
      setMasked(inp, t.checked);
      btn.hidden = !t.checked;
      syncMaskBtn(btn, t.checked);
    }
  });
  form.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || !form.contains(b)) return;
    const act = b.dataset.act;
    if (act === 'add-game') {
      const rows = form.querySelector('.games-rows');
      rows.insertAdjacentHTML('beforeend', gameRowHTML(blankGame()).s);
      rows.lastElementChild.querySelector('.g-game').focus();
    } else if (act === 'add-cf') {
      const rows = form.querySelector('.cf-rows');
      rows.insertAdjacentHTML('beforeend', cfRowHTML({ id: uid(), name: '', value: '', secret: false }).s);
      rows.lastElementChild.querySelector('.cf-name').focus();
    } else if (act === 'remove-row') {
      const row = b.closest('.game-row, .cf-row');
      const container = row.parentElement;
      row.remove();
      const next = container.parentElement.querySelector('[data-act="add-game"], [data-act="add-cf"]');
      if (next) next.focus();
    } else if (act === 'gen-pass') {
      const pwInput = el('password');
      pwInput.value = generatePassword(+lenInput.value, form.querySelector('[data-gen="sym"]').checked);
      setMasked(pwInput, false);
      syncMaskBtn(pwInput.closest('.input-wrap').querySelector('[data-act="toggle-mask"]'), false);
      paint();
      pwInput.focus();
      pwInput.select();
    }
  });
  const initial = opts.draft ? null : serializeForm(form); // rascunho restaurado já começa com alterações
  // Bloqueio com o formulário alterado: lock() guarda o que está na tela como rascunho (ver saveDraftOnLock)
  draftGetters.set(d.el, () => {
    if (saved || d.closing || d.closed || serializeForm(form) === initial) return null; // salvo ou descartado
    const r = readAccountForm(form, orig, isNew);
    return { accountId: isNew ? null : id, isNew, account: r.account || rawAccountForm(form, orig), at: nowISO() };
  });
  d.beforeClose = async () => {
    if (serializeForm(form) === initial) return true;
    return confirmDialog({ title: 'Descartar alterações?', message: 'Você fez alterações nesta conta que ainda não foram salvas.', confirmText: 'Descartar', cancelText: 'Continuar editando', danger: true });
  };
  const errEl = form.querySelector('.form-error');
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!S.unlocked) return;
    errEl.textContent = '';
    if (!isNew && serializeForm(form) === initial) { d.beforeClose = null; d.close(); return; }
    const r = readAccountForm(form, orig, isNew);
    if (r.error) {
      errEl.textContent = r.error;
      if (r.focus) {
        // o campo com erro pode estar numa seção recolhida: abre antes de focar
        for (let d = r.focus.closest('details'); d; d = d.parentElement && d.parentElement.closest('details')) d.open = true;
        r.focus.focus(); if (r.focus.scrollIntoView) r.focus.scrollIntoView({ block: 'center' }); }
      return;
    }
    saved = true;
    commit(v => {
      const i = v.accounts.findIndex(x => x.id === r.account.id);
      if (i >= 0) v.accounts[i] = r.account; else v.accounts.unshift(r.account);
      if (v.draft && v.draft.account.id === r.account.id) v.draft = null; // rascunho desta conta ficou velho
    });
    d.beforeClose = null;
    d.close();
    toast(isNew ? 'Conta adicionada' : 'Conta atualizada');
  });
  setTimeout(() => { if (d.el.isConnected) el('label').focus(); }, 0);
}
function setMasked(inp, masked) {
  if (inp.dataset.maskMode === 'css') inp.classList.toggle('masked', masked);

}
function isMasked(inp) { return inp.type === 'password' || inp.classList.contains('masked'); }
function syncMaskBtn(btn, masked) {
  if (!btn) return;

  btn.setAttribute('aria-label', masked ? 'Mostrar' : 'Ocultar');
  setHTML(btn, icon(masked ? 'eye' : 'eye-off'));
}

  const d = openDialog({ className: 'dlg-md sheet', content: settingsHTML() });
  d.el.dataset.settings = '1';
  const root = d.el;
  root.querySelector('#set-autolock').addEventListener('change', e => {
    const v = Number(e.target.value);
    commit(vv => { vv.settings.autoLockMin = v; }, { data: false });
    lastActivity = Date.now();
    toast(v ? 'Bloqueio automático: ' + (v === 60 ? '1 hora' : v + ' min') : 'Bloqueio automático desativado');
  });
  root.querySelector('#set-clip').addEventListener('change', e => {
    const v = Number(e.target.value);
    commit(vv => { vv.settings.clipboardClearSec = v; }, { data: false });
    toast('Preferência salva');
  });
  const minLock = root.querySelector('#set-minlock');
  refreshUpdateSection(false);
  const defRec = root.querySelector('#set-defrec');
  if (defRec) defRec.addEventListener('change', () => {
    const v = defRec.value.trim().slice(0, 200);
    commit(vv => { vv.settings.defaultRecoveryEmail = v; }, { data: false });
    toast(v ? 'E-mail de recuperação padrão salvo' : 'E-mail de recuperação padrão removido');
  });
  const defRecApply = root.querySelector('#set-defrec-apply');
  if (defRecApply) defRecApply.addEventListener('click', async () => {
    const v = (defRec ? defRec.value : S.vault.settings.defaultRecoveryEmail).trim().slice(0, 200);
    if (!v) { toast('Preencha o e-mail de recuperação padrão primeiro.', 'error'); if (defRec) defRec.focus(); return; }
    const missing = S.vault.accounts.filter(a => !a.recoveryEmail);
    if (!missing.length) { toast('Todas as contas já têm e-mail de recuperação.'); return; }
    const ok = await confirmDialog({ title: 'Aplicar e-mail de recuperação?', message: 'Colocar ' + v + ' em ' + plural(missing.length, 'conta que está', 'contas que estão') + ' sem e-mail de recuperação. As que já têm um não mudam.', confirmText: 'Aplicar' });
    if (!ok || !S.unlocked) return;
    const t = nowISO();
    const ids = new Set(missing.map(a => a.id));
    commit(vv => { vv.settings.defaultRecoveryEmail = v; for (const a of vv.accounts) if (ids.has(a.id) && !a.recoveryEmail) { a.recoveryEmail = v; a.updatedAt = t; } });
    toast('E-mail de recuperação aplicado em ' + plural(ids.size, 'conta', 'contas'));
  });
  const mcAuto = root.querySelector('#set-mcauto');
  if (mcAuto) mcAuto.addEventListener('change', () => { const v = mcAuto.checked; commit(vv => { vv.settings.mcAutoRefresh = v; }, { data: false }); toast('Preferência salva'); });
  const mcOf = root.querySelector('#set-mcof');
  if (mcOf) mcOf.addEventListener('change', () => { const v = mcOf.checked; commit(vv => { vv.settings.mcOptifine = v; }, { data: false }); toast('Preferência salva'); });
  const mcNow = root.querySelector('#set-mcnow');
  if (mcNow) mcNow.addEventListener('click', async () => {
    mcNow.disabled = true;
    mcNow.textContent = 'Atualizando…';
    const r = await refreshProfiles(true, (i, t) => { if (mcNow.isConnected) mcNow.textContent = 'Atualizando ' + i + '/' + t + '…'; });
    if (!mcNow.isConnected) return;
    mcNow.disabled = false;
    mcNow.textContent = 'Atualizar agora';
    if (r && r.busy) toast('Já está atualizando. Espere alguns segundos.');
    else if (!r || !r.total) toast('Nenhuma conta com skin do Minecraft ou perfil da Steam buscado.');
    else if (r.error) toast('Não foi possível atualizar tudo agora. Verifique a internet.', 'error');
    else if (!r.changed) toast('Tudo já estava atualizado.');
  });
  if (minLock) minLock.addEventListener('change', () => {
    const v = minLock.checked;
    commit(vv => { vv.settings.lockOnMinimize = v; }, { data: false });
    toast(v ? 'O cofre vai bloquear ao minimizar' : 'Preferência salva');
  });
  if (DESKTOP) Desk.refresh().then(() => updateBackupIndicators());
  const form = root.querySelector('#chg-form');
  const cur = form.querySelector('#cm-cur'), n1 = form.querySelector('#cm-new'), n2 = form.querySelector('#cm-new2');
  const err = form.querySelector('.form-error');
  n1.addEventListener('input', () => paintStrength(form.querySelector('#cm-strength'), n1.value, []));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    if (!cur.value) { err.textContent = 'Digite a senha mestra atual.'; cur.focus(); return; }
    if (Array.from(n1.value).length < MIN_MASTER_LEN) { err.textContent = 'A nova senha precisa ter pelo menos ' + MIN_MASTER_LEN + ' caracteres.'; n1.focus(); return; }
    if (strength(n1.value, []).score < 2) { err.textContent = 'Nova senha muito fraca. Use uma frase maior ou misture letras, números e símbolos.'; n1.focus(); return; }
    if (n1.value !== n2.value) { err.textContent = 'As novas senhas não conferem.'; n2.focus(); return; }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Alterando…';
    try {
      await saveChain;
      const env = readStoredEnvelope();
      if (!env) throw new Error('cofre não encontrado');
      await openEnvelope(cur.value, env);
      const salt = randomSalt();
      const key = await deriveKey(n1.value, salt, KDF_ITERATIONS);
      if (!S.unlocked) return;
      const prevCred = { key: S.key, salt: S.salt, iterations: S.iterations };
      S.key = key; S.salt = salt; S.iterations = KDF_ITERATIONS;
      try {
        await persist({ snapshot: 'antes-senha' });
      } catch (saveErr) {
        // a troca foi desfeita: o cofre no disco não mudou, então a cópia pedida não precisa mais ir
        if (S.key === key) { S.key = prevCred.key; S.salt = prevCred.salt; S.iterations = prevCred.iterations; if (pendingSnapshots.get(S.gen) === 'antes-senha') pendingSnapshots.delete(S.gen); }
        throw saveErr;
      }
      cur.value = ''; n1.value = ''; n2.value = '';
      paintStrength(form.querySelector('#cm-strength'), '', []);
      form.closest('details').open = false;
      toast('Senha mestra alterada. Baixe um novo backup!');
    } catch (ex) {
      err.textContent = ex instanceof WrongPasswordError ? 'A senha mestra atual está incorreta.' : 'Não foi possível alterar: ' + (ex && ex.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Alterar senha mestra';
    }
  });
}
async function exportEncrypted() {
  if (!S.unlocked) return;
  try {
    await saveChain;
    const env = await encryptVault(S.key, S.salt, S.iterations, S.vault, S.rev);
    const name = 'harmful-backup-' + todayStamp() + '.json';
    if (DESKTOP) {
      const r = await window.desktop.saveBackup(JSON.stringify(env), name);
      if (!r || r.canceled || !S.unlocked) return;
    } else {
      downloadFile(name, JSON.stringify(env), 'application/json');
    }
    commit(v => { v.settings.lastBackupAt = nowISO(); }, { data: false });
    const s = $('#set-lastbackup');
    if (s) s.textContent = 'Último backup salvo: ' + fmtDateTime(S.vault.settings.lastBackupAt);
    toast(DESKTOP ? 'Backup salvo. Guarde uma cópia fora deste PC (pendrive, nuvem).' : 'Backup baixado. Guarde uma cópia fora deste PC (pendrive, nuvem).');
  } catch (e) {
    toast('Não foi possível gerar o backup: ' + errMsg(e), 'error');
  }
}
function errMsg(e) { return String((e && e.message) || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, ''); }
function csvCell(v, allowFormula) {
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = allowFormula && s.length <= 255 && !/[\r\n]/.test(s) ? '="' + s.replace(/"/g, '""') + '"' : "'" + s;
  return /[";\r\n]/.test(s) || s !== s.trim() ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(accounts) {
  const cols = ['Plataforma', 'Nome da conta', 'Status', 'Favorita', 'Login', 'E-mail', 'Senha', 'Senha alterada em', 'ID da conta', 'Link do perfil', '2FA', 'Telefone', 'E-mail de recuperação', 'Códigos de backup', 'Região', 'Conta criada em', 'Valor investido', 'Valor do inventário', 'Jogos', 'Imagem', 'Tags', 'Campos personalizados', 'Anotações', 'Adicionada em', 'Atualizada em'];
  const SECRET_COLS = new Set([6, 13]);
  const gameText = g => g.game + [g.nickname && 'nick: ' + g.nickname, g.rank && 'rank: ' + g.rank, g.peak && 'melhor: ' + g.peak, g.level && 'nível: ' + g.level, g.hours != null && 'horas: ' + numToInput(g.hours), g.notes && 'obs: ' + g.notes].filter(Boolean).map((x, i) => (i ? ' | ' : ' [') + x).join('') + (g.nickname || g.rank || g.peak || g.level || g.hours != null || g.notes ? ']' : '');
  const rows = accounts.map(a => [
    platformName(a), a.label, statusLabel(a.status), a.favorite ? 'Sim' : 'Não', a.login, a.email, a.password,
    a.passwordUpdatedAt ? fmtDateTime(a.passwordUpdatedAt) : '', a.accountId, a.profileUrl, a.twoFA ? TWOFA_MAP[a.twoFA].label : '',
    a.phone, a.recoveryEmail, a.backupCodes, a.region, fmtDay(a.createdOn), numToInput(a.spent), numToInput(a.inventoryValue),
    a.games.map(gameText).join('\n'), a.avatar ? 'Sim' : 'Não', a.tags.join(', '), a.customFields.map(f => f.name + ': ' + f.value).join('\n'), a.notes,
    fmtDateTime(a.createdAt), fmtDateTime(a.updatedAt)
  ]);
  return '﻿' + [cols].concat(rows).map(r => r.map((c, i) => csvCell(c, SECRET_COLS.has(i))).join(';')).join('\r\n');
}
async function exportCSV() {
  if (!S.unlocked) return;
  const ok = await confirmDialog({
    title: 'Exportar sem criptografia?',
    message: 'O arquivo CSV terá todas as suas senhas em texto puro. Qualquer pessoa com acesso a ele poderá ler tudo. Apague o arquivo quando não precisar mais.',
    confirmText: 'Exportar mesmo assim', danger: true
  });
  if (!ok || !S.unlocked) return;
  const name = 'harmful-contas-' + todayStamp() + '.csv';
  if (DESKTOP) {
    try {
      const r = await window.desktop.saveCSV(toCSV(S.vault.accounts), name);
      if (!r || r.canceled) return;
    } catch (e) { toast('Não foi possível exportar: ' + errMsg(e), 'error'); return; }
  } else {
    downloadFile(name, toCSV(S.vault.accounts), 'text/csv;charset=utf-8');
  }
  toast('Planilha exportada');
}
function mergeAccounts(current, incoming) {
  const byId = new Map(current.map(a => [a.id, a]));
  let added = 0, updated = 0;
  for (const a of incoming) {
    const ex = byId.get(a.id);
    if (!ex) { byId.set(a.id, a); added++; }
    else if ((a.updatedAt || '') > (ex.updatedAt || '')) { byId.set(a.id, a); updated++; }
  }
  return { accounts: Array.from(byId.values()), added, updated };
}
async function importBackupFlow(opts) {
  opts = opts || {};
  let file;
  if (DESKTOP) {
    try {
      const r = await window.desktop.openBackup({ snapshots: !!opts.snapshots });
      if (!r || r.canceled) return;
      file = { name: r.name, text: r.text };
    } catch (e) { toast('Não foi possível abrir o arquivo: ' + errMsg(e), 'error'); return; }
  } else {
    const f = await pickFile('.json,application/json');
    if (!f) return;
    if (f.size > 50 * 1024 * 1024) { toast('Arquivo grande demais para ser um backup do Harmful.', 'error'); return; }
    try { file = { name: f.name, text: await f.text() }; } catch (e) { toast('Não foi possível ler o arquivo.', 'error'); return; }
  }
  let env;
  try { env = JSON.parse(file.text); } catch (e) { toast('Este arquivo não é um backup do Harmful.', 'error'); return; }
  if (!validateEnvelope(env)) { toast('Este arquivo não é um backup válido do Harmful.', 'error'); return; }
  const wasUnlocked = S.unlocked;
  const opened = await askPassword({
    title: 'Senha do backup',
    message: html`Digite a senha mestra que estava em uso quando o backup <strong>${file.name}</strong> foi feito.`,
    submitText: 'Abrir backup',
    verify: pw => openEnvelope(pw, env)
  });
  if (!opened) return;
  if (wasUnlocked !== S.unlocked) return;
  const data = normalizeVault(opened.data);
  const n = data.accounts.length;
  if (!wasUnlocked) {
    if (Store.get()) {
      const ok = await confirmDialog({ title: DESKTOP ? 'Substituir o cofre atual?' : 'Substituir o cofre deste navegador?', message: 'Já existe um cofre salvo aqui. Restaurar o backup vai substituí-lo por completo, e a senha mestra passará a ser a senha do backup.', confirmText: 'Substituir', danger: true });
      if (!ok) return;
    }
    startSession({ key: opened.key, salt: opened.salt, iterations: opened.iterations, vault: data, rev: 0 });
    // se não gravou (ex.: a cópia do cofre atual falhou), o erro já apareceu: sem aviso de "restaurado"
    if (!(await persist({ snapshot: 'antes-restaurar' }).then(() => true, () => false))) return;
    toast('Backup restaurado: ' + plural(n, 'conta', 'contas') + '. A senha mestra é a do backup.');
    return;
  }
  const choice = await choiceDialog({
    title: 'Importar backup',
    message: html`O backup tem <strong>${plural(n, 'conta', 'contas')}</strong>. Como deseja importar? Sua senha mestra atual continua a mesma.`,
    choices: [
      { id: 'merge', label: 'Mesclar com o cofre atual', desc: 'Adiciona as contas novas e atualiza as que estiverem mais recentes no backup.' },
      { id: 'replace', label: 'Substituir tudo', desc: 'Apaga as contas atuais e fica só com as do backup.', danger: true }
    ]
  });
  if (!choice || !S.unlocked) return;
  if (choice === 'merge') {
    const r = mergeAccounts(S.vault.accounts, data.accounts);
    commit(v => { v.accounts = r.accounts; }, { snapshot: 'antes-importar' });
    toast('Importação concluída: ' + plural(r.added, 'conta adicionada', 'contas adicionadas') + ', ' + plural(r.updated, 'atualizada', 'atualizadas') + '.');
  } else {
    const ok = await confirmDialog({ title: 'Substituir todas as contas?', message: 'As ' + plural(S.vault.accounts.length, 'conta atual', 'contas atuais') + ' serão trocadas pelas ' + plural(n, 'conta', 'contas') + ' do backup.', confirmText: 'Substituir', danger: true });
    if (!ok || !S.unlocked) return;
    commit(v => { v.accounts = data.accounts; }, { snapshot: 'antes-importar' });
    toast('Cofre substituído pelo backup (' + plural(n, 'conta', 'contas') + ').');
  }
}
async function deleteVaultFlow() {
  const ok = await confirmDialog({
    title: 'Apagar o cofre?',
    message: DESKTOP
      ? 'Todas as contas serão apagadas deste computador. Por segurança, uma última cópia criptografada fica na pasta de cópias automáticas (dá para apagá-la manualmente). Backups que você salvou em outros lugares não são afetados.'
      : 'Todas as contas salvas neste navegador serão apagadas permanentemente. Backups que você baixou não são afetados.',
    confirmText: 'Apagar tudo', danger: true, requireText: 'APAGAR'
  });
  if (!ok) return;
  S.unlocked = false;
  S.gen++;
  $$('dialog').forEach(d => { try { d.close(); } catch (e) { /* ignora */ } });
  try { await saveChain; } catch (e) { /* ignora */ }
  try { await Store.remove(); } catch (e) {
    toast('Não foi possível apagar o cofre: ' + errMsg(e), 'error');
    S.key = null; S.salt = null; S.vault = null; auditCache = null;
    renderGate();
    return;
  }
  await Autosave.unlink().catch(() => {});
  S.key = null; S.salt = null; S.vault = null; S.rev = 0; auditCache = null;
  stopAutoLock();
  renderSetup();
  toast('Cofre apagado.');
}

function newAccountFromContext() {
  const o = {};
  let platformFixed = false;
  if (ui.view === 'accounts') {
    const f = ui.filter;
    if (f.type === 'game') { const g = aggregateGames().find(x => x.key === f.value); if (g) o.game = g.name; }
    else if (f.type === 'platform') {
      platformFixed = true;
      if (f.value.startsWith('outro:')) { o.platform = 'outro'; const p = aggregatePlatforms().find(x => x.key === f.value); o.platformName = p ? p.name : ''; }
      else o.platform = f.value;
    } else if (f.type === 'status') o.status = f.value;
    else if (f.type === 'fav') o.favorite = true;
    else if (f.type === 'tag') { const t = aggregateTags().find(x => x.key === f.value); if (t) o.tags = [t.name]; }
  }
  openAccountForm(null, { template: blankAccount(o), platformFixed });
}
function deleteAccount(id) {
  const idx = S.vault.accounts.findIndex(a => a.id === id);
  if (idx < 0) return;
  const removed = S.vault.accounts[idx];
  commit(v => { v.accounts.splice(idx, 1); });
  toast('Conta “' + accTitle(removed) + '” excluída', 'ok', {
    label: 'Desfazer',
    fn: () => {
      if (!S.unlocked || findAccount(removed.id)) return;
      commit(v => { v.accounts.splice(Math.min(idx, v.accounts.length), 0, removed); });
      toast('Conta restaurada');
    }
  });
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch (act) {
    case 'toggle-mask': {
      const wrap = el.closest('.input-wrap');
      const inp = wrap && wrap.querySelector('input, textarea');
      if (!inp) return;
      const nowMasked = !isMasked(inp);
      setMasked(inp, nowMasked);
      syncMaskBtn(el, nowMasked);
      return;
    }
    case 'restore-backup': case 'import-backup': importBackupFlow(); return;
    case 'restore-snapshot': importBackupFlow({ snapshots: true }); return;
    case 'delete-vault': deleteVaultFlow(); return;
    case 'open-folder':
      if (DESKTOP) window.desktop.openFolder(el.dataset.folder).then(ok => { if (!ok) toast('Não foi possível abrir a pasta.', 'error'); }).catch(() => toast('Não foi possível abrir a pasta.', 'error'));
      return;

  if (act === 'toggle-pop') { if (ui.pop === el.dataset.pop) closePop(true); else openPop(el.dataset.pop); return; }

  if (ui.pop && el.closest('.pop')) closePop(true);

    case 'new-account': closeSidebar(); newAccountFromContext(); break;
    case 'open-account': openDetail(id); break;

      const dlg = el.closest('dialog');
      if (dlg) dlg.close();
      openAccountForm(id, { fromDetail: !!dlg });
      break;
    }
    case 'dup-account': {
      const a = findAccount(id);
      if (!a) return;
      const copy = JSON.parse(JSON.stringify(a));
      const t = nowISO();
      copy.id = uid(); copy.createdAt = t; copy.updatedAt = t;
      copy.label = (a.label || accTitle(a)) + ' (cópia)';
      copy.games = copy.games.map(g => Object.assign(g, { id: uid() }));
      copy.customFields = copy.customFields.map(f => Object.assign(f, { id: uid() }));
      // Leitura do Valorant e avatar ligado a um perfil (skin do Minecraft por uuid, perfil da Steam) são da conta
      // original: a cópia começa sem eles (imagem comum continua)
      copy.valorant = null;
      if (copy.avatar && (copy.avatar.type === 'steam' || (copy.avatar.type === 'mcskin' && copy.avatar.uuid))) copy.avatar = null;
      const dlg = el.closest('dialog');
      if (dlg) dlg.close();
      openAccountForm(null, { template: copy, platformFixed: true });
      break;
    }
    case 'del-account': {
      const a = findAccount(id);
      if (!a) return;
      const ok = await confirmDialog({ title: 'Excluir esta conta?', message: html`A conta <strong>${accTitle(a)}</strong> (${platformName(a)}) será removida do cofre.`, confirmText: 'Excluir', danger: true });
      if (!ok || !S.unlocked) return;
      const dlg = $('dialog[data-detail-id="' + CSS.escape(id) + '"]');

      deleteAccount(id);
      break;
    }
    case 'ignore-reuse': {
      const ids = new Set(String(el.dataset.ids || '').split(',').filter(Boolean));
      if (!ids.size) return;
      commit(v => { for (const a of v.accounts) if (ids.has(a.id) && a.password) a.reuseOk = a.passwordUpdatedAt || a.createdAt; });
      toast('Aviso ignorado. Ele volta se alguma dessas senhas mudar.');

    }

      ui.search = '';
      ui.animate = 'full';

      const c = el.dataset.cape;
      if (!a || !a.avatar || a.avatar.type !== 'mcskin' || !a.avatar.capes || !['mojang', 'optifine', 'none'].includes(c)) return;
      if (c !== 'none' && !a.avatar.capes[c]) return;
      commit(() => { a.avatar = Object.assign({}, a.avatar, { cape: c }); a.updatedAt = nowISO(); });
      const again = $('dialog[open] [data-act="set-cape"][data-cape="' + c + '"]');
      if (again) again.focus({ preventScroll: true });
      break;
    }
    case 'set-layout': {
      savePrefs({ layout: el.dataset.layout === 'grid' ? 'grid' : 'list', lv: 2 });
      ui.animate = 'full';
      renderMain();
      const nb = $('#main [data-act="set-layout"][data-layout="' + prefs.layout + '"]');
      if (nb) nb.focus({ preventScroll: true });
      break;
    }
    case 'val-refresh': valorantRefresh(id); break;
    case 'toggle-more-games': {
      ui.moreGames = !ui.moreGames;
      renderSidebar();
      const t = $('#sidebar [data-act="toggle-more-games"]');
      if (t) t.focus({ preventScroll: true });
      break;
    }
    case 'toggle-sidebar': {
      const sh = $('#shell');
      if (!sh) return;
      const open = sh.classList.toggle('sidebar-open');
      if (open) { const first = $('#sidebar .nav-item'); if (first) first.focus(); }
      break;
    }
    case 'lock': lock(); break;
    case 'settings': closeSidebar(); openSettings(); break;
    case 'backup-now': exportEncrypted(); break;
    case 'export-csv': exportCSV(); break;
    case 'dismiss-banner': ui.bannerDismissed = true; { const slot = $('#banner-slot'); if (slot) setHTML(slot, ''); } break;
    case 'set-theme': {
      savePrefs({ theme: el.dataset.themeId });
      fadeTheme(applyTheme);
      for (const b of $$('[data-act="set-theme"]')) b.setAttribute('aria-checked', b.dataset.themeId === prefs.theme ? 'true' : 'false');
      break;
    }
    case 'autosave-link':
      try { await Autosave.link(); toast('Backup automático ativado'); }
      catch (ex) { if (!ex || ex.name !== 'AbortError') toast('Não foi possível usar esse arquivo: ' + (ex && ex.message), 'error'); }
      updateBackupIndicators();
      break;
    case 'autosave-reconnect':
      try { await Autosave.reconnect(); if (Autosave.status === 'ok') toast('Backup automático reativado'); }
      catch (ex) { toast('Não foi possível reativar: ' + (ex && ex.message), 'error'); }
      updateBackupIndicators();
      break;
    case 'autosave-unlink': await Autosave.unlink(); toast('Backup automático desativado'); break;
    case 'extra-choose': case 'extra-resolve': {
      if (!DESKTOP) return;
      try {
        const r = await window.desktop.chooseExtraFolder({ current: act === 'extra-resolve' });
        await Desk.refresh();
        if (r && !r.canceled) {
          if (Desk.extra.state === 'error') toast('Não foi possível gravar nessa pasta: ' + Desk.extra.error, 'error');
          else toast(r.extraFile && r.extraFile !== 'harmful-backup.json' ? 'Cópia extra gravada como ' + r.extraFile : 'Cópia extra ativada');
        }
      } catch (ex) { toast(errMsg(ex), 'error'); }
      updateBackupIndicators();
      break;
    }
    case 'extra-retry': {
      if (!DESKTOP) return;
      await persist().catch(() => {});
      await Desk.refresh();
      updateBackupIndicators();
      toast(Desk.extra.state === 'ok' ? 'Cópia extra gravada' : 'Ainda não foi possível gravar a cópia extra', Desk.extra.state === 'ok' ? 'ok' : 'error');
      break;
    }
    case 'extra-clear': {
      if (!DESKTOP) return;
      try { await window.desktop.clearExtraFolder(); } catch (ex) { /* ignora */ }
      await Desk.refresh();
      updateBackupIndicators();
      toast('Cópia extra desativada');
      break;
    }
  }
});
// Aplica o termo da busca. O campo espera 90 ms de pausa na digitação; Enter e ↓ aplicam na hora.
function applySearch() {
  const s = $('#search');
  if (!S.unlocked || !s) return;
  if (s.value === ui.search && ui.view === 'accounts') return; // já aplicado (ex.: Enter antes da pausa)
  ui.search = s.value;
  ui.animate = ui.view !== 'accounts' ? 'full' : 'flip';
  if (ui.view !== 'accounts') ui.view = 'accounts';
  renderSidebar();
  renderMain();
}
// Copia a senha ou o login (ou e-mail) pelo teclado. O aviso diz de qual conta é, porque o alvo pode não estar à vista.
async function copyAccountField(id, which) {
  const a = findAccount(id);
  if (!a) return;
  const field = which === 'password' ? 'password' : loginField(a);
  const value = field ? getField(id, field, '') : '';
  if (!value) { toast('“' + idTitle(a) + '” não tem ' + (which === 'password' ? 'senha salva' : 'login nem e-mail salvo'), 'error'); return; }
  const meta = fieldMeta(id, field, '');
  if (await copyText(value, meta[0] + ' de ' + idTitle(a), meta[1])) flashCopied($('#main .card[data-key="' + CSS.escape(id) + '"] [data-act="copy"][data-field="' + field + '"]'));
}
// Teclado da lista. Na busca: Enter abre a 1ª conta, Ctrl+Enter copia a senha dela, Shift+Enter o login (ou e-mail)
// e ↓ desce para a lista. Numa conta: setas andam entre as contas (↑ na 1ª volta para a busca) e Ctrl/Shift+Enter
// copiam dela. Devolve true quando tratou a tecla.
function listKeydown(e, t) {
  if (e.altKey || e.isComposing || !t || !t.closest) return false;
  const mod = e.ctrlKey || e.metaKey;
  const arrow = !mod && !e.shiftKey && /^Arrow(Up|Down|Left|Right)$/.test(e.key);
  if (e.key !== 'Enter' && !arrow) return false;
  const inSearch = t.id === 'search';
  const card = inSearch ? null : t.closest('#main .card[data-key]');
  if (!card && !(inSearch && (e.key === 'Enter' || e.key === 'ArrowDown'))) return false;
  // Enter segurado: a repetição não reabre o painel (que fecharia e abriria sem parar) nem copia de novo
  if (e.key === 'Enter' && e.repeat && (inSearch || mod || e.shiftKey)) { e.preventDefault(); return true; }
  if (inSearch && t.value !== ui.search) applySearch(); // vale o que está digitado, sem esperar a pausa
  if (ui.view !== 'accounts') return false;
  const cards = $$('#main .card[data-key]');
  const go = c => { const b = c && c.querySelector('.card-open'); if (b) { e.preventDefault(); b.focus(); } return !!b; };
  if (arrow) {
    if (inSearch) return go(cards[0]);
    e.preventDefault();
    const i = cards.indexOf(card);
    const cols = cards.filter(c => c.offsetTop === cards[0].offsetTop).length || 1; // na grade, ↑/↓ pulam uma linha
    if (e.key === 'ArrowUp' && i - cols < 0) { const s = $('#search'); if (s) s.focus(); return true; }
    const step = { ArrowDown: cols, ArrowUp: -cols, ArrowRight: 1, ArrowLeft: -1 }[e.key];
    const last = cards[cards.length - 1];
    go(cards[i + step] || (e.key === 'ArrowDown' && last.offsetTop > card.offsetTop ? last : null));
    return true;
  }
  const target = card || cards[0];
  if (mod || e.shiftKey) {
    e.preventDefault();
    if (target) copyAccountField(target.dataset.key, mod ? 'password' : 'login');
    else toast('Nenhuma conta encontrada', 'error');
    return true;
  }
  if (card || !target) return false; // Enter numa conta: o próprio botão focado resolve
  e.preventDefault();
  openDetail(target.dataset.key);
  return true;
}
document.addEventListener('keydown', e => {
  if (e.altKey && !e.ctrlKey && !e.metaKey && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && S.unlocked && ui.view === 'accounts' && !$('dialog[open]')) {
    const card = document.activeElement && document.activeElement.closest && document.activeElement.closest('#main .card[data-key]');
    if (card) {
      const cards = $$('#main .card[data-key]');
      const i = cards.indexOf(card);
      const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';
      const other = cards[fwd ? i + 1 : i - 1];
      e.preventDefault();
      if (!other) return;
      const id = card.dataset.key;
      moveAccount(id, other.dataset.key, fwd);
      const again = $('#main .card[data-key="' + CSS.escape(id) + '"] .card-open');
      if (again) again.focus({ preventScroll: false });
      return;
    }
  }
  if (DESKTOP && S.unlocked && (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'l') {
    e.preventDefault();
    lock();
    return;
  }
  if (ui.pop && S.unlocked && popKeydown(e)) return;
  if (!S.unlocked || $('dialog[open]')) return;
  const t = e.target;
  const typing = t && t.closest && t.closest('input, textarea, select, [contenteditable]');
  if (listKeydown(e, t)) return;
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k')) {
    e.preventDefault();
    const s = $('#search');
    if (s) { s.focus(); s.select(); }
  } else if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'n') {
    e.preventDefault();
    newAccountFromContext();
  } else if (e.key === 'Escape') {
    const sh = $('#shell');
    if (sh && sh.classList.contains('sidebar-open')) { closeSidebar(); return; }
    if (t && t.id === 'search' && t.value) { t.value = ''; ui.search = ''; ui.animate = 'flip'; renderSidebar(); renderMain(); }
  }
});

// Popovers: clicar ou focar fora fecha (sem roubar o foco)
document.addEventListener('pointerdown', e => {
  if (!ui.pop) return;
  const w = $('#' + ui.pop + '-wrap');
  if (!w || !w.contains(e.target)) closePop(false);
}, true);
document.addEventListener('focusin', e => {
  if (!ui.pop) return;
  const w = $('#' + ui.pop + '-wrap');
  if (!w || !w.contains(e.target)) closePop(false);
});
window.addEventListener('resize', debounce(() => { if (S.unlocked) placeInk(false); }, 120));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.unlocked) placeInk(false); });

// Lembra se o "Filtros" da barra lateral está aberto (a barra é redesenhada a cada commit).
// O evento "toggle" não borbulha, por isso a escuta é na fase de captura.
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.remember === 'filters') ui.filtersOpen = d.open;
}, true);

/* ---------- Sincronização entre abas ---------- */
window.addEventListener('storage', async e => {
  if (e.key === PREFS_KEY) { prefs = loadPrefs(); applyTheme(); return; }
  if (DESKTOP) return;
  if (e.key !== STORAGE_KEY && e.key !== null) return;
  let text = null;
  try { text = localStorage.getItem(STORAGE_KEY); } catch (ex) { text = null; }
  if (!S.unlocked) {
    if (!$('dialog[open]') && gateKey() !== gateMode) renderGate();
    return;
  }
  if (!text) { lock('O cofre foi apagado em outra aba.'); return; }
  let env;
  try { env = JSON.parse(text); } catch (ex) { return; }
  if (!validateEnvelope(env)) return;
  if (env.kdf.salt !== bytesToB64(S.salt) || env.kdf.iterations !== S.iterations) {
    lock('A senha mestra foi alterada em outra aba. Desbloqueie de novo.');
    return;
  }
  try {
    const data = await decryptEnvelope(S.key, env);
    if (!S.unlocked) return;
    S.vault = normalizeVault(data);
    S.rev = Math.max(S.rev, env.rev || 0);
    auditCache = null;
    rerender();
  } catch (ex) { /* ignora dados que não abrem com a chave atual */ }
});

/* =========================================================
   Início
   ========================================================= */
applyTheme();
buildStaticDatalists();
/* Atualização: quando a nova versão termina de baixar, avisa (com botão) e mostra também nas Configurações.
   Se a pessoa não reiniciar agora, ela é instalada sozinha quando o app for fechado. */
let updateToastShown = false;
function updateReady() {
  const el = $('#upd-sec');
  if (el) refreshUpdateSection();
  if (updateToastShown) return;
  updateToastShown = true;
  const show = () => toast('Nova versão do Harmful pronta.', 'ok', { label: 'Reiniciar agora', fn: installUpdateNow });
  if (S.unlocked) show(); else setTimeout(() => { if (S.unlocked) show(); else updateToastShown = false; }, 4000);
}
async function installUpdateNow() {
  try {
    await saveChain;
    const ok = await window.desktop.installUpdate();
    if (!ok) toast('A atualização ainda não está pronta.', 'error');
  } catch (e) { toast('Não foi possível reiniciar: ' + errMsg(e), 'error'); }
}
function updateSectionHTML(u) {
  const cur = (u && u.current) || (Desk.info && Desk.info.version) || APP_VERSION;
  if (!u || !u.enabled) return html`<p class="small faint">Versão ${cur}. A atualização automática funciona no app instalado.</p>`;
  const line = u.state === 'ready' ? html`<p class="small">Versão ${u.version} baixada e pronta.</p><div class="btn-row"><button type="button" class="btn sm primary" id="upd-install">Reiniciar e atualizar</button></div>`
    : u.state === 'downloading' ? html`<p class="small">Baixando a versão ${u.version}…</p>`
    : u.state === 'checking' ? html`<p class="small faint">Procurando atualizações…</p>`
    : u.state === 'error' ? html`<p class="small faint">Não foi possível verificar agora.</p><div class="btn-row"><button type="button" class="btn sm" id="upd-check">Tentar de novo</button></div>`
    : html`<p class="small faint">${u.state === 'latest' ? 'Você está na versão mais recente.' : 'Confere sozinho ao abrir o app.'}</p><div class="btn-row"><button type="button" class="btn sm" id="upd-check">Procurar atualizações</button></div>`;
  return html`<p class="small">Versão atual: <strong>${cur}</strong></p>${line}`;
}
async function refreshUpdateSection(force) {
  const el = $('#upd-sec');
  if (!el || !DESKTOP || !window.desktop.updateStatus) return;
  let u = null;
  try { u = force ? await window.desktop.checkUpdate() : await window.desktop.updateStatus(); } catch (e) { u = null; }
  if (!el.isConnected) return;
  setHTML(el, updateSectionHTML(u));
  const chk = el.querySelector('#upd-check');
  if (chk) chk.addEventListener('click', () => { setHTML(el, html`<p class="small faint">Procurando atualizações…</p>`); refreshUpdateSection(true); });
  const ins = el.querySelector('#upd-install');
  if (ins) ins.addEventListener('click', installUpdateNow);
}
async function boot() {
  if (!window.crypto || !crypto.subtle) {
    setHTML(app, html`<div class="gate"><div class="gate-card"><div class="gate-brand">${LOGO}<strong>Harmful</strong></div><h1>Navegador sem suporte</h1><p class="muted">Este navegador não oferece a criptografia necessária (Web Crypto). Abra o arquivo no Google Chrome, Microsoft Edge ou Firefox atualizados.</p></div></div>`);
    return;
  }
  if (DESKTOP) {
    try {
      await Store.init();
    } catch (e) {
      // Nunca mostra a tela de "criar cofre" se não deu para ler o arquivo: isso poderia sobrescrever os dados.
      gateShell(html`<div><h1>Não foi possível abrir os dados</h1><p class="muted" style="margin-top:6px">O arquivo do cofre existe, mas não pôde ser lido agora.</p></div>
        <p class="gate-msg err">${errMsg(e)}</p>
        <div class="btn-row"><button type="button" class="btn primary" data-act="retry-boot">Tentar de novo</button><button type="button" class="btn" data-act="open-folder" data-folder="data">Abrir pasta dos dados</button></div>`);
      const b = $('[data-act="retry-boot"]');
      if (b) b.addEventListener('click', () => boot());
      return;
    }
    Desk.refresh();
    window.desktop.onEvent(name => {
      if (name === 'update:ready') { updateReady(); return; }
      if (!S.unlocked) return;
      if (name === 'system-lock') lock('Cofre bloqueado porque o computador foi bloqueado ou suspenso.');
      else if (name === 'minimized' && S.vault && S.vault.settings.lockOnMinimize) lock('Cofre bloqueado ao minimizar a janela.');
    });
  }
  renderGate();
}
boot();
})();
